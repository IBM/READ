[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "read-toolkit"
version = "0.1.0a1"
description = "Diagnostic toolkit for measuring whether LLM-as-a-Judge systems ground policy-compliance verdicts in the provided policy text"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Adam Kahirov" }]
keywords = ["llm", "llm-as-a-judge", "policy", "evaluation", "robustness", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.78",
    "anthropic>=0.84",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.15",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10", "pandas>=2.3"]
dev = ["pytest>=7.4", "matplotlib>=3.10", "pandas>=2.3"]

[project.urls]
Repository = "https://github.com/IBM/READ"

[project.scripts]
read-benchmark = "run_benchmark:main"
read-failure-mode = "read_toolkit.failure_modes:main"
read-summarize = "read_toolkit.summarize_results:main"
read-ingest = "read_toolkit.polyguard_ingest:main"

[tool.setuptools]
py-modules = ["run_benchmark"]

[tool.setuptools.packages.find]
include = ["read_toolkit*"]
